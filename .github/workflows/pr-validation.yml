name: pr-validation

# Gate 2 — code validation. Runs on every pull request targeting main.
# No AWS credentials are used or needed in this workflow.
#
# Blocking checks: install (lock file), production build, secret scan.
# Advisory (non-blocking, reported in the job summary) until the pre-existing
# issues in BACKLOG.md are cleared: astro check, link check, npm audit.
# Promote them to blocking by removing `continue-on-error`.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for secret scanning

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (lock file)
        run: npm ci

      - name: Analytics wrapper unit tests (blocking)
        run: node src/utils/analytics/trackApprovedEvent.test.mjs

      - name: Astro type check (advisory)
        continue-on-error: true
        run: |
          npm install --no-save @astrojs/check typescript
          npx astro check

      - name: Production build
        env:
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.PUBLIC_RECAPTCHA_SITE_KEY }}
          PUBLIC_LAMBDA_ENDPOINT: ${{ vars.PUBLIC_LAMBDA_ENDPOINT }}
          PUBLIC_GOOGLE_REVIEWS_ENDPOINT: ${{ vars.PUBLIC_GOOGLE_REVIEWS_ENDPOINT }}
          PUBLIC_GOOGLE_ADS_ID: ${{ vars.PUBLIC_GOOGLE_ADS_ID }}
        run: npm run build

      - name: Generate artifact manifest (validation)
        run: node scripts/ci/make-manifest.mjs dist manifest.json && head -c 400 manifest.json

      - name: Internal link check (advisory)
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress "dist/**/*.html"
          fail: true

      - name: Dependency vulnerability audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Secret scan (blocking)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
