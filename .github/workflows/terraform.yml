name: terraform

# Infrastructure plan/apply via OIDC (no stored AWS secrets).
#
#   pull_request touching infra/** -> `terraform plan` per stack (read role)
#   workflow_dispatch              -> gated `apply` of ONE chosen stack,
#                                     behind the protected `production` env.
#
# Active stacks: infra/shared (wildcard cert) and infra/environments/dev.
# infra/environments/prd is an import-first adoption of LIVE resources and is
# intentionally NOT wired here yet — it is a separate, carefully-reviewed
# project (see docs/CICD.md). Note: the initial creation of the dev stack is
# expected to be applied locally by the admin (bootstrap runbook); this
# workflow covers ongoing changes.

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      stack:
        description: "Stack to apply"
        required: true
        type: choice
        options:
          - infra/shared
          - infra/environments/dev
          # infra/analytics intentionally NOT applyable via this workflow yet:
          # the tf-apply role lacks IAM/EC2/SSM/DLM/SNS permissions for it.
          # First apply (if approved) runs via CloudShell admin, like bootstrap.

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-2
  PLAN_ROLE_ARN: arn:aws:iam::025037641706:role/github-actions-nextgendental-tf-plan
  APPLY_ROLE_ARN: arn:aws:iam::025037641706:role/github-actions-nextgendental-tf-apply

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [infra/shared, infra/environments/dev, infra/analytics]
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.5.0"

      - run: terraform init -input=false
      - run: terraform fmt -check -recursive
        continue-on-error: true
      - run: terraform validate
      - name: Terraform plan (${{ matrix.stack }})
        run: terraform plan -no-color -input=false

  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production # protected — manual approval required
    defaults:
      run:
        working-directory: ${{ inputs.stack }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.5.0"

      - run: terraform init -input=false
      - name: Terraform apply (${{ inputs.stack }})
        run: terraform apply -input=false -auto-approve
