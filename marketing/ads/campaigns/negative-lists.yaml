    risk_tier: review
    phrase_count: 7
    evidence:
      - source: "search terms report, exact-phrase match of THIS list"
        period: "2026-07-11..2026-08-09"
        sample: "65 of 876 terms matched; 1 click; $7.75; 1 CONVERSION ('cedar park modern dentistry')"
        spend_by_campaign: "Performance Max $7.75 (1 click, 1 conv) | Leads $0.00"
        status: counter_evidence
        observed_at: "2026-08-10"
        caveat: "Blocking these would have blocked a recorded conversion. A South Austin resident may legitimately compare north-metro practices. NOT generated for import under any plan."
