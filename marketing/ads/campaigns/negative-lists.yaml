        period: "n/a"
        sample: "n/a"
        status: policy
        observed_at: "2026-08-10"
    match_type: phrase
    terms: [georgetown, "round rock", "cedar park", leander, hutto, taylor, lockhart]
approvals_note: "See approval-manifest.yaml — plain YAML fields are not approval evidence."
