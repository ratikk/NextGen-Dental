# Shared negative-keyword lists (campaign-as-code) — REVISED per 2026-08-10 review.
# Lists are CREATED UNATTACHED (Plan A). Attachment to the live Leads campaign is
# Plan B (separate impact review + approval). Attachment to the new paused
# campaign happens with Plan C activation review.
schema_version: 1
negative_lists:
  - name: "NEG | Freebie Intent (low-risk)"
    risk_tier: low
    evidence:
      - source: "Google Ads search terms report CSV (owner-exported)"
        period: "2026-07-11..2026-08-09"
        sample: "881 terms; this category $155.33 / 29 clicks / 1 conversion"
        status: verified
        observed_at: "2026-08-10"
    match_type: phrase
    terms: [free, "no cost", study, studies, trial, trials, "clinical trial", volunteer, grant, grants, "dental school"]
  - name: "NEG | Price-Sensitive (needs business confirmation)"
    risk_tier: confirm
    evidence:
      - source: "Same report; low volume"
        period: "2026-07-11..2026-08-09"
        sample: "minor spend; excluding may block price-conscious but bookable patients"
        status: inferred
        observed_at: "2026-08-10"
    match_type: phrase
    terms: [cheapest, donation, "hygiene school"]
  - name: "NEG | Competitor Brands (strategy decision)"
    risk_tier: confirm
    evidence:
      - source: "Same report"
        period: "2026-07-11..2026-08-09"
        sample: "~$110 on navigational queries for other practices; 2 conversions of UNKNOWN quality (misdial hypothesis unproven)"
        status: verified_spend_inferred_quality
        observed_at: "2026-08-10"
    match_type: phrase
    terms: ["aspen dental", "castle dental", "ideal dental", "rodeo dental", "7 to 7 dental",
            "ace dental", "trident dental", "kovar dental", "stonehaven dental",
            "forest family dentistry", "access dental", "elite dentistry", "smile haus",
            "enamel dentistry", "avery ranch dental", "vida dental", "carus dental",
            "hutto smiles", "tooth time", "rose dental", "reveal dental", "airport dental",
            "dr king dental", "cool creek dental", "onion creek family dentistry",
            "mint dentistry", "bright now", "western dental", "jefferson dental", "affordable dentures"]
  - name: "NEG | Far Geography (clearly outside strategy)"
    risk_tier: low
    evidence:
      - source: "Same report"
        period: "2026-07-11..2026-08-09"
        sample: "$11.16 / 325 impressions from 60-120min-away cities"
        status: verified
        observed_at: "2026-08-10"
    match_type: phrase
    terms: [temple, killeen, kerrville, cibolo, "harker heights", waco, belton,
