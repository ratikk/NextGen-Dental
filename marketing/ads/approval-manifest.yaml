# The approval RECORD-KEEPING file. It validates approval completeness and
# authorized identity LABELS. Authenticity depends on protected-branch controls,
# verified reviewer identity in the PR, and retained external evidence (e.g. an
# approved PR review, or a written dentist confirmation) - a YAML string alone
# does not prove a named person approved anything. Statuses are meaningless without approved_by + approved_at.
# The validator enforces: authorized role, non-empty identity, valid UTC timestamp
# before expiry, digest match against the plan's own package, and gate ordering.
# Any regeneration of artifacts changes the digest and INVALIDATES approvals.
